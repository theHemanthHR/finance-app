services:
  postgres:
    image: postgres:16-alpine
    container_name: finora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finora}
      POSTGRES_USER: ${POSTGRES_USER:-finora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finora}
    ports: ["5432:5432"]
    volumes: ["finora_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finora} -d ${POSTGRES_DB:-finora}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: finora-backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finora}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SESSION_COOKIE_SECURE: "false"
      CURRENCY_API_BASE_URL: ${CURRENCY_API_BASE_URL:-https://open.er-api.com/v6}
    ports: ["8080:8080"]

volumes:
  finora_pgdata:
